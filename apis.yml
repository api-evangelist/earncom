name: Earn.com
description: 'Earn.com was a cryptocurrency startup founded in 2013 as 21e6 and later
  known as 21 Inc and 21.co, backed by a16z and others, which raised over $116 million.
  It began as a Bitcoin mining venture selling the 21 Bitcoin Computer, then pivoted
  to a paid-messaging marketplace where senders paid recipients in cryptocurrency to
  read and reply to email. Coinbase acquired Earn.com in April 2018 for a reported
  $120 million, and co-founder Balaji Srinivasan became Coinbase''s first Chief Technology
  Officer. The standalone Earn.com product was retired and the brand was folded into
  Coinbase Earn, the learn-and-earn program. As of July 2026 the earn.com domain issues
  a blanket HTTP 301 redirect for every path to https://www.coinbase.com/earn, and
  no developer, documentation, or API subdomain resolves. Earn.com therefore has no
  independent API surface; any remaining API capability lives under Coinbase.'
